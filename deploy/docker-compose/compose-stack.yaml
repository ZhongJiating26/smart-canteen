x-backend-env: &backend-env
  MYSQL_HOST: mysql
  MYSQL_PORT: 3306
  MYSQL_USERNAME: root
  MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:-root123456}
  NACOS_SERVER_ADDR: nacos:8848
  SEATA_ENABLED: "true"
  SEATA_SERVER_ADDR: seata:8091
  JWT_SECRET: ${JWT_SECRET:-smart-canteen-local-development-secret}

services:
  mysql:
    image: mysql:8.0.44
    container_name: canteen-stack-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_HOST_PORT:-3106}:3306"
    volumes:
      - stack-mysql-data:/var/lib/mysql
      - ../sql:/docker-entrypoint-initdb.d:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.2
    container_name: canteen-stack-redis
    ports:
      - "${REDIS_HOST_PORT:-6179}:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-root123456}
    volumes:
      - stack-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-root123456} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: canteen-stack-nacos
    environment:
      MODE: standalone
      TZ: Asia/Shanghai
    ports:
      - "${NACOS_HOST_PORT:-8148}:8848"
      - "${NACOS_GRPC_HOST_PORT:-9148}:9848"
    restart: unless-stopped

  rocketmq-namesrv:
    image: apache/rocketmq:5.2.0
    container_name: canteen-stack-rocketmq-namesrv
    command: sh mqnamesrv
    ports:
      - "${ROCKETMQ_NAMESRV_HOST_PORT:-9176}:9876"
    restart: unless-stopped

  rocketmq-broker:
    image: apache/rocketmq:5.2.0
    container_name: canteen-stack-rocketmq-broker
    depends_on:
      - rocketmq-namesrv
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
      ROCKETMQ_BROKER_HOST: ${ROCKETMQ_BROKER_HOST:-rocketmq-broker}
    command: |
      sh -c 'cat > /tmp/broker.conf <<EOF
      brokerClusterName=DefaultCluster
      brokerName=broker-a
      brokerId=0
      brokerIP1=$${ROCKETMQ_BROKER_HOST:-rocketmq-broker}
      listenPort=10911
      EOF
      exec sh mqbroker -c /tmp/broker.conf -n "$${NAMESRV_ADDR}" --enable-proxy'
    expose:
      - "10911"
      - "10909"
      - "8081"
    restart: unless-stopped

  rocketmq-init:
    image: apache/rocketmq:5.2.0
    container_name: canteen-stack-rocketmq-init
    depends_on:
      - rocketmq-namesrv
      - rocketmq-broker
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
      ROCKETMQ_TOPICS: ${ROCKETMQ_TOPICS:-order-timeout}
    command: |
      sh -c 'for i in $$(seq 1 30); do
        if sh mqadmin clusterList -n "$${NAMESRV_ADDR}" >/dev/null 2>&1; then
          for topic in $${ROCKETMQ_TOPICS:-order-timeout}; do
            sh mqadmin updateTopic -n "$${NAMESRV_ADDR}" -c DefaultCluster -t "$${topic}" || exit 1
          done
          exit 0
        fi
        sleep 2
      done
      echo "RocketMQ broker is not ready, failed to create topics: $${ROCKETMQ_TOPICS:-order-timeout}" >&2
      exit 1'
    restart: on-failure

  rocketmq-dashboard:
    image: apacherocketmq/rocketmq-dashboard:latest
    container_name: canteen-stack-rocketmq-dashboard
    depends_on:
      - rocketmq-namesrv
    environment:
      JAVA_OPTS: "-Drocketmq.namesrv.addr=rocketmq-namesrv:9876"
    ports:
      - "${ROCKETMQ_DASHBOARD_HOST_PORT:-8188}:8082"
    restart: unless-stopped

  seata:
    image: seataio/seata-server:2.1.0
    container_name: canteen-stack-seata
    environment:
      SEATA_IP: seata
      SEATA_PORT: 8091
      STORE_MODE: file
      TZ: Asia/Shanghai
    ports:
      - "${SEATA_HOST_PORT:-8191}:8091"
      - "${SEATA_CONSOLE_HOST_PORT:-7191}:7091"
    restart: unless-stopped

  user-service:
    image: maven:3.9.9-eclipse-temurin-17
    container_name: canteen-stack-user-service
    working_dir: /workspace
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_started
    environment:
      <<: *backend-env
    volumes:
      - ../../backend:/workspace
      - stack-maven-repo:/root/.m2
    command: ./mvnw -q -pl user-service -am spring-boot:run
    ports:
      - "${USER_SERVICE_HOST_PORT:-9001}:9001"
    restart: unless-stopped

  menu-service:
    image: maven:3.9.9-eclipse-temurin-17
    container_name: canteen-stack-menu-service
    working_dir: /workspace
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_started
      seata:
        condition: service_started
    environment:
      <<: *backend-env
    volumes:
      - ../../backend:/workspace
      - stack-maven-repo:/root/.m2
    command: ./mvnw -q -pl menu-service -am spring-boot:run
    ports:
      - "${MENU_SERVICE_HOST_PORT:-9002}:9002"
    restart: unless-stopped

  order-service:
    image: maven:3.9.9-eclipse-temurin-17
    container_name: canteen-stack-order-service
    working_dir: /workspace
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_started
      seata:
        condition: service_started
      rocketmq-init:
        condition: service_completed_successfully
    environment:
      <<: *backend-env
      ROCKETMQ_NAME_SERVER: rocketmq-namesrv:9876
      ORDER_TIMEOUT_TOPIC: ${ORDER_TIMEOUT_TOPIC:-order-timeout}
    volumes:
      - ../../backend:/workspace
      - stack-maven-repo:/root/.m2
    command: ./mvnw -q -pl order-service -am spring-boot:run
    ports:
      - "${ORDER_SERVICE_HOST_PORT:-9003}:9003"
    restart: unless-stopped

  pickup-service:
    image: maven:3.9.9-eclipse-temurin-17
    container_name: canteen-stack-pickup-service
    working_dir: /workspace
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_started
    environment:
      <<: *backend-env
    volumes:
      - ../../backend:/workspace
      - stack-maven-repo:/root/.m2
    command: ./mvnw -q -pl pickup-service -am spring-boot:run
    ports:
      - "${PICKUP_SERVICE_HOST_PORT:-9004}:9004"
    restart: unless-stopped

  gateway-service:
    image: maven:3.9.9-eclipse-temurin-17
    container_name: canteen-stack-gateway-service
    working_dir: /workspace
    depends_on:
      redis:
        condition: service_healthy
      nacos:
        condition: service_started
      user-service:
        condition: service_started
      menu-service:
        condition: service_started
      order-service:
        condition: service_started
      pickup-service:
        condition: service_started
    environment:
      <<: *backend-env
    volumes:
      - ../../backend:/workspace
      - stack-maven-repo:/root/.m2
    command: ./mvnw -q -pl gateway-service -am spring-boot:run
    ports:
      - "${GATEWAY_HOST_PORT:-9000}:9000"
    restart: unless-stopped

volumes:
  stack-mysql-data:
  stack-redis-data:
  stack-maven-repo:
