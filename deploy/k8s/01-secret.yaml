apiVersion: v1
kind: Secret
metadata:
  name: canteen-secret
  namespace: infra
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: root123456
  REDIS_PASSWORD: root123456
---
apiVersion: v1
kind: Secret
metadata:
  name: canteen-app-secret
  namespace: canteen
type: Opaque
stringData:
  MYSQL_USERNAME: root
  MYSQL_PASSWORD: root123456
  REDIS_PASSWORD: root123456
  JWT_SECRET: replace-with-a-shared-jwt-secret-at-least-32-bytes-long