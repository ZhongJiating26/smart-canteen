apiVersion: v1
kind: ConfigMap
metadata:
  name: seata-config
  namespace: infra
data:
  registry.conf: |
    registry {
      type = "file"
    }
    config {
      type = "file"
      file {
        name = "file.conf"
      }
    }
  file.conf: |
    store {
      mode = "file"
    }
---
apiVersion: v1
kind: Service
metadata:
  name: seata-headless
  namespace: infra
spec:
  clusterIP: None
  selector:
    app: seata
  ports:
    - name: seata
      port: 8091
      targetPort: 8091
---
apiVersion: v1
kind: Service
metadata:
  name: seata
  namespace: infra
spec:
  type: ClusterIP
  selector:
    app: seata
  ports:
    - name: seata
      port: 8091
      targetPort: 8091
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seata
  namespace: infra
spec:
  serviceName: seata-headless
  replicas: 1
  selector:
    matchLabels:
      app: seata
  template:
    metadata:
      labels:
        app: seata
    spec:
      containers:
        - name: seata
          image: seataio/seata-server:1.7.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: seata
              containerPort: 8091
          env:
            - name: SEATA_IP
              value: seata.infra.svc.cluster.local
            - name: SEATA_PORT
              value: "8091"
            - name: STORE_MODE
              value: file
            - name: SEATA_CONFIG_NAME
              value: file:/root/seata-config/registry
            - name: TZ
              value: Asia/Shanghai
          volumeMounts:
            - name: seata-config
              mountPath: /root/seata-config
            - name: seata-data
              mountPath: /root/seata
      volumes:
        - name: seata-config
          configMap:
            name: seata-config
  volumeClaimTemplates:
    - metadata:
        name: seata-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi