apiVersion: v1
kind: Service
metadata:
  name: rocketmq-namesrv
  namespace: infra
spec:
  type: ClusterIP
  selector:
    app: rocketmq-namesrv
  ports:
    - name: namesrv
      port: 9876
      targetPort: 9876
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rocketmq-namesrv
  namespace: infra
spec:
  serviceName: rocketmq-namesrv
  replicas: 1
  selector:
    matchLabels:
      app: rocketmq-namesrv
  template:
    metadata:
      labels:
        app: rocketmq-namesrv
    spec:
      containers:
        - name: namesrv
          image: apache/rocketmq:5.2.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              cd /home/rocketmq/rocketmq-*/bin
              sh mqnamesrv
          ports:
            - name: namesrv
              containerPort: 9876
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rocketmq-broker-config
  namespace: infra
data:
  broker.conf: |
    brokerClusterName = DefaultCluster
    brokerName = broker-a
    brokerId = 0
    namesrvAddr = rocketmq-namesrv.infra.svc.cluster.local:9876
    brokerIP1 = rocketmq-broker.infra.svc.cluster.local
    listenPort = 10911
    autoCreateTopicEnable = true
    autoCreateSubscriptionGroup = true
    storePathRootDir = /home/rocketmq/store
    storePathCommitLog = /home/rocketmq/store/commitlog
    brokerRole = ASYNC_MASTER
    flushDiskType = ASYNC_FLUSH
---
apiVersion: v1
kind: Service
metadata:
  name: rocketmq-broker
  namespace: infra
spec:
  type: ClusterIP
  selector:
    app: rocketmq-broker
  ports:
    - name: broker
      port: 10911
      targetPort: 10911
    - name: vip
      port: 10909
      targetPort: 10909
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rocketmq-broker
  namespace: infra
spec:
  serviceName: rocketmq-broker
  replicas: 1
  selector:
    matchLabels:
      app: rocketmq-broker
  template:
    metadata:
      labels:
        app: rocketmq-broker
    spec:
      containers:
        - name: broker
          image: apache/rocketmq:5.2.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              cd /home/rocketmq/rocketmq-*/bin
              sh mqbroker -n rocketmq-namesrv.infra.svc.cluster.local:9876 -c /home/rocketmq/conf/broker.conf
          ports:
            - name: broker
              containerPort: 10911
            - name: vip
              containerPort: 10909
          volumeMounts:
            - name: broker-config
              mountPath: /home/rocketmq/conf
            - name: broker-store
              mountPath: /home/rocketmq/store
      volumes:
        - name: broker-config
          configMap:
            name: rocketmq-broker-config
  volumeClaimTemplates:
    - metadata:
        name: broker-store
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 3Gi