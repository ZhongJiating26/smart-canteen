apiVersion: v1
kind: Service
metadata:
  name: menu-service
  namespace: canteen
spec:
  type: ClusterIP
  selector:
    app: menu-service
  ports:
    - name: http
      port: 9002
      targetPort: 9002
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: menu-service
  namespace: canteen
spec:
  replicas: 1
  selector:
    matchLabels:
      app: menu-service
  template:
    metadata:
      labels:
        app: menu-service
    spec:
      containers:
        - name: menu-service
          image: k3d-smart-canteen-registry:5000/menu-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9002
          envFrom:
            - configMapRef:
                name: canteen-common-config
            - secretRef:
                name: canteen-app-secret
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 9002
            initialDelaySeconds: 40
            periodSeconds: 10