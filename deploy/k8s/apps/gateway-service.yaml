apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: canteen
spec:
  type: ClusterIP
  selector:
    app: gateway-service
  ports:
    - name: http
      port: 9000
      targetPort: 9000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: canteen
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      containers:
        - name: gateway-service
          image: k3d-smart-canteen-registry:5000/gateway-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9000
          envFrom:
            - configMapRef:
                name: canteen-common-config
            - secretRef:
                name: canteen-app-secret
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 9000
            initialDelaySeconds: 60
            periodSeconds: 10