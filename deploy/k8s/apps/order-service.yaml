apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: canteen
spec:
  type: ClusterIP
  selector:
    app: order-service
  ports:
    - name: http
      port: 9003
      targetPort: 9003
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: canteen
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: smart-canteen-registry.localhost:5000/order-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9003
          envFrom:
            - configMapRef:
                name: canteen-common-config
            - secretRef:
                name: canteen-app-secret
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 9003
            initialDelaySeconds: 50
            periodSeconds: 10
